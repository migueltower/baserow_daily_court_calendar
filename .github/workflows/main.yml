name: daily court calendar scraper 

on:
  schedule:
    - cron: '0 12 * * 1-5'   # Mon–Fri at 9AM
  workflow_dispatch:        # Manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Use plain pip to keep this simple and fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        env:
          BASEROW_TOKEN: ${{ secrets.BASEROW_TOKEN }}
          DELETE_ROWS_OLDER_THAN_DAYS: "1"
          BASEROW_CREATED_FIELD: "Created"
          DRY_RUN_DELETE_OLD_ROWS: "true"
        run: python fetch.py
